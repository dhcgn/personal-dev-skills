# yaml-language-server: $schema=https://microsoft.github.io/apm/specs/schemas/manifest-v0.1.schema.json
name: dev-base
version: 2.1.0
description: APM project for dev-base
author: Daniel
# agent-skills deploys to .agents/skills/, which opencode, Codex, Copilot, Cursor and Gemini all read.
targets:
- agent-skills
dependencies:
  apm:
  - path: ../../.apm/skills/gh
  - path: ../../.apm/skills/rtk
  - path: ../../.apm/skills/wsl
  - path: ../../.apm/skills/markdown-from-website
  - path: ../../.apm/skills/devcontainer-debug-windows

  - path: ../../.apm/skills/glossary-init
  - path: ../../.apm/skills/glossary-create
  - path: ../../.apm/skills/glossary-search
  - path: ../../.apm/skills/glossary-create-issue

  # ponytail is vendored (MIT, see .apm/skills/ponytail/LICENSE): upstream ships hooks for every
  # harness in one package, which APM 0.37 refuses to install on claude/copilot targets.
  - path: ../../.apm/skills/ponytail
  - path: ../../.apm/skills/ponytail-audit
  - path: ../../.apm/skills/ponytail-debt
  - path: ../../.apm/skills/ponytail-gain
  - path: ../../.apm/skills/ponytail-help
  - path: ../../.apm/skills/ponytail-review
  - cloudflare/security-audit-skill#c1c8a8c1471069fb0e188eeaff69b8e8db6564a8
  mcp: []
includes: auto
scripts: {}
