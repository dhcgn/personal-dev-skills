# yaml-language-server: $schema=https://microsoft.github.io/apm/specs/schemas/manifest-v0.1.schema.json
name: dev-go
version: 2.0.0
description: APM project for dev-go
author: Daniel
# agent-skills deploys to .agents/skills/, which opencode, Codex, Copilot, Cursor and Gemini all read.
targets:
- agent-skills
dependencies:
  apm:
  - path: ../dev-base
  - path: ../../.apm/skills/go-1-27-features
  - path: ../../.apm/skills/go-linq
  - path: ../../.apm/skills/go-newest-version
  - path: ../../.apm/skills/go-wails
  - path: ../../.apm/skills/github-markdown-images

  # spf13/go-skills is a Claude marketplace repo, the root resolves to no skills, so reference each skill folder
  - spf13/go-skills/go
  - spf13/go-skills/go-release
  - spf13/go-skills/go-spec-reviewer
  - spf13/go-skills/wails
  - spf13/go-skills/cobra-viper
  - spf13/go-skills/fileflow-pathologize
  mcp: []
includes: auto
scripts: {}
