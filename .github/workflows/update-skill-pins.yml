# Dependabot for APM: bumps the pinned third-party skills in profiles/*/apm.yml, one PR per repo.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
name: Update skill pins

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bump pins and open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash update-skill-pins.sh --pr
